# ofono RIL configuration for MediaTek MT6768 (X6812)
#
# The vendor VINTF manifest of this device exposes:
#   android.hardware.radio@1.2  and  @1.5  as  slot1 / slot2
#   (plus em1/em2/imsAospSlot1/imsAospSlot2/se1/se2)
# Merlin used radio@1.4, this device has 1.5, so the interface is bumped here.

[Settings]
emptyPinQuery=false
radioPowerCycle=false
confirmRadioPowerOn=false
networkSelectionManual0=false
cellInfoIntervalShortMs=0
useDataProfiles=true
mmsDataProfileId=1001
# RIL_REQUEST_HANGUP_WAITING_OR_BACKGROUND
rilRequestOnSetUdub=13

[ril_0]
transport=binder:name=slot1;interface=radio@1.5
name=slot1

[ril_1]
transport=binder:name=slot2;interface=radio@1.5
name=slot2
