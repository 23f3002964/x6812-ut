# Bring-up aid: mirror the journal into the kernel log.
#
# The phone has no UART and CONFIG_VT is off, so console=tty0 prints nowhere.
# The readable log is MTK's ram_console: /dev/kmsg lines end up in
# /proc/last_kmsg, which survives a reboot and can be read from Android with
#   adb shell su -c "cat /proc/last_kmsg"
# so this is the only way to see why a boot failed before the UI is up.
#
# Remove this file for a production build - it spams the screen with logs and
# costs a little boot time.

[Journal]
ForwardToKMsg=yes
RateLimitBurst=0
